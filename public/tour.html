<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫序 · 操作流程演示</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f4ed;color:#242c28;font:16px system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:6px 0;font-size:32px}a{color:#275c48}p{line-height:1.7}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button{border:1px solid #ccd6ce;background:white;border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer}button[aria-current=true],#play{background:#285f4b;color:white}figure{margin:0;border:1px solid #d6dfd9;border-radius:18px;overflow:hidden;background:white}img{width:100%;display:block;animation:fade .35s}figcaption{padding:18px 24px}h2{margin:0 0 6px;font-size:23px}#description{margin:0}footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.note{font-size:14px;color:#57675c}@keyframes fade{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:640px){main{padding:16px}h1{font-size:25px}nav button{font-size:13px;padding:10px}}</style>
<main><header><div><small>MANXU / PRODUCT WALKTHROUGH</small><h1>从研究，到有据可循的迭代</h1></div><a href="/">打开工作台 ↗</a></header><p>真实页面截图组成的六步演示。自动播放每步停留 6 秒，也可以暂停、点选步骤或使用左右方向键。</p><nav aria-label="演示步骤" id="steps"></nav><figure><img id="screen" alt=""><figcaption aria-live="polite"><h2 id="title"></h2><p id="description"></p></figcaption></figure><footer><button id="previous">← 上一步</button><button id="play">自动播放</button><button id="next">下一步 →</button><span id="progress"></span><a id="try" href="/">亲自体验此步骤 ↗</a></footer><p class="note">记录是教学示例，评分、Tokens 和费用没有实测值，不填零。示例成片在本机真实合成后预置；公网版支持浏览器保存与导出，实时模型、上传与合成使用完整本机版。《下次做给我吃》在其他平台制作，不是漫序产出。</p></main>
<script>
const slides=[['01-overview.jpg','实践总览','1 · 从完整工作空间开始','研究、评测、创作和质量记录集中展示，进入各阶段继续工作。','/'],['02-research.jpg','研究依据','2 · 把观察写成有来源的需求','记录目标、输入、通过条件和证据链接，关联创作项目；保存后刷新仍能恢复。','/?view=research'],['03-evaluation.jpg','模型评测','3 · 用同一任务比较模型','固定样例和 Prompt 版本，保留原始输出。未实测的评分、错误数与成本保持未知。','/?view=evaluation'],['04-continuity.jpg','分镜连续性','4 · 先确认，再制作','把角色、道具、起止状态和准确台词写入镜头卡，检查相邻镜头的连续性。','/?view=studio'],['05-quality.jpg','问题定位','5 · 从成片时间回到源镜头','输入 5.67 秒，定位到第 2 镜及 5.67—12.67 秒区间，带入问题记录安排局部修订。切点仍需播放器复核。','/?view=quality'],['06-record.jpg','复测与导出','6 · 留下复测与版本证据','分别记录局部、相邻镜头和全片检查，保存每次版本，并导出 Markdown 与原始历史。归档不自动代表验收通过。','/?view=quality']];
let current=0,timer=null;const screen=document.getElementById('screen'),steps=document.getElementById('steps'),play=document.getElementById('play');slides.forEach((s,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' '+s[1];b.onclick=()=>{pause();show(i)};steps.append(b)});function show(i){current=(i+slides.length)%slides.length;const s=slides[current];screen.src='/demo/tour/'+s[0];screen.alt=s[2]+'：'+s[3];screen.style.animation='none';void screen.offsetWidth;screen.style.animation='';document.getElementById('title').textContent=s[2];document.getElementById('description').textContent=s[3];document.getElementById('try').href=s[4];document.getElementById('progress').textContent=(current+1)+' / '+slides.length;[...steps.children].forEach((b,j)=>b.setAttribute('aria-current',String(j===current)))}function pause(){clearInterval(timer);timer=null;play.textContent='自动播放';play.setAttribute('aria-pressed','false')}play.onclick=()=>{if(timer)pause();else{play.textContent='暂停播放';play.setAttribute('aria-pressed','true');timer=setInterval(()=>show(current+1),6000)}};document.getElementById('previous').onclick=()=>{pause();show(current-1)};document.getElementById('next').onclick=()=>{pause();show(current+1)};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){pause();show(current+(e.key==='ArrowRight'?1:-1))}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});show(0);
</script></html>
